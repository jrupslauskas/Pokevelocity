# Route definitions with wild Pokemon encounters
#
# Structure:
#   - name: Route name (must be unique)
#     description: Route description text
#     gate_requirement: Gate number (0-8) that must be unlocked to access this route
#     order: Display order (unique, determines route sequence)
#     encounters:
#       - pokemon: Pokemon name (must match exactly from pokemon.yml)
#         spawn_rate: Weight for random selection (higher = more common)
#
# To see updates, run: bin/rails db:seed

