# Route definitions with wild Pokemon encounters
#
# Structure:
#   - name: Route name (must be unique)
#     description: Route description text
#     encounters:
#       - pokemon: Pokemon name (must match exactly from pokemon.yml)
#         spawn_rate: Weight for random selection (higher = more common)
#
# To add a new route, just add another entry to this list and run: bin/rails db:seed

- name: Pallet Town
  description: MAKE SURE TO NOTE THAT ONLY ONE CAN BE CAUGHT
  encounters:
    - pokemon: Bulbasaur
      spawn_rate: 33
    - pokemon: Squirtle
      spawn_rate: 33
    - pokemon: Charmander
      spawn_rate: 33

- name: Route 1
