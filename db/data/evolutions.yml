# Evolution Requirements for All Pokemon
# Format:
#   - from: pokedex number of base pokemon
#     to: pokedex number of evolved pokemon
#     item: required item key (evolution_stone, fire_stone, water_stone, thunder_stone)
#
# Quantity is automatically calculated:
#   - Elemental stones (fire, water, thunder): always 1
#   - Evolution stones: max(1, to_pokemon.difficulty - 1)

