# Gate definitions for route progression system
#
# gate_number: Sequential order (0-8)
# name: Display name of the gate
# description: Flavor text
# required_difficulty_score: Cumulative difficulty points needed to unlock
# sprite_type: "emoji" or "gym_leader"
# sprite_value: emoji character or gym leader sprite filename
#
# Difficulty scores are cumulative - catching more difficult Pokemon
# (higher difficulty rating) earns more points toward unlocking gates.

# Gate 0: Professor Oak (requires catching starter)
- gate_number: 0
  name: "Professor Oak - Let Your Adventure Begin!"
  description: "Catch your starter Pokémon from Professor Oak before venturing out!"
  required_difficulty_score: 2
  sprite_type: "gym_leader"
  sprite_value: "oak"

